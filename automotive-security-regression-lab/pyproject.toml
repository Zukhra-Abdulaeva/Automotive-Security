[project]
name = "automotive-security-regression-lab"
version = "0.1.0"
description = "Controlled, simulated laboratory for reproducible automotive security regression testing."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9,<10",
]

[tool.pytest]
minversion = "9.0"
testpaths = ["04_tests"]
pythonpath = ["03_src"]
addopts = ["-ra", "-q"]
