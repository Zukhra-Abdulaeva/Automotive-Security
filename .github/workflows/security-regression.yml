name: Security Regression

on:
  push:
  pull_request:

jobs:
  security-regression:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest>=9,<10"

      - name: Run security regression tests
        run: pytest -v 04_tests/test_security_regression.py

      - name: Generate CI evidence
        if: always()
        run: |
          python -c "import sys; sys.path.insert(0, '04_tests'); sys.path.insert(0, '03_src'); from pathlib import Path; from test_security_regression import generate_regression_evidence; files = generate_regression_evidence(Path('ci-evidence')); print('\n'.join(str(path) for path in files))"

      - name: Upload CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-regression-evidence
          path: ci-evidence/